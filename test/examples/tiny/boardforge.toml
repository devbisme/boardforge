# Tiny 2-layer design for the end-to-end test (test/test_pipeline.py).
[design]
file = "tiny.py"
top = "build"
title = "boardforge tiny test"

[fab]
tier = "standard"
renders = false

[board]
layers = 2
fill = 0.12  # loose on purpose: compaction shrinks it
pours = ["GND"]
mounting_holes = { footprint = "" }

[rules]
track_width = 0.2
clearance = 0.2
via_diameter = 0.6
via_drill = 0.3

[routing]
chain = ["freerouting", "astar"]

[routing.freerouting]
max_passes = 10

[placement.compact]
enabled = true
min_scale = 0.7

# The LDO's sheet goes in the right half (regions scale with the compacted board).
[[placement.region]]
sheet = "regulator"
area = [0.5, 0.0, 1.0, 1.0]
