[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boardforge"
version = "0.1.0"
description = "Turn a SKiDL circuit into a routed, manufacturable KiCad board, headless."
readme = "README.md"
# tomllib (stdlib) is used for configuration and fab profiles. KiCad 10 ships Python 3.11,
# and the board scripts in boardforge.pcb run under it, so 3.11 is the floor for both sides.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dave Vandenbout", email = "dave@vdb.name" }]
keywords = ["KiCad", "PCB", "SKiDL", "EDA", "routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
# skidl >= 3.0.0 reads KiCad 10 .kicad_symdir libraries and writes the fields, attributes and
# net classes into its netlist; schematizer >= 0.2.0 has the labels-only schematic mode.
dependencies = [
    "skidl>=3.0.0",
    "schematizer>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/devbisme/boardforge"
Repository = "https://github.com/devbisme/boardforge"
Issues = "https://github.com/devbisme/boardforge/issues"

[project.optional-dependencies]
test = ["pytest"]
# A few vendored kicad-happy validators use these.
analysis = ["jsonschema", "referencing"]

[project.scripts]
boardforge = "boardforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boardforge = ["fabs/*/*.toml", "vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "kicad: needs KiCad 10 (kicad-cli and its Python)",
    "slow: runs the full pipeline (minutes)",
]

[tool.black]
line-length = 100
